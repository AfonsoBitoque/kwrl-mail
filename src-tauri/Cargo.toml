[package]
name = "corvo-desktop"
version = "0.2.0"
description = "Corvo — Cliente desktop Gmail OAuth2+PKCE com cache SQLite e inferência local isolada llama.cpp"
authors = ["Equipa Corvo"]
edition = "2021"
default-run = "corvo-desktop"

[lib]
name = "corvo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "corvo-desktop"
path = "src/main.rs"

# Processo sidecar isolado para inferência C++ llama.cpp (§3.3):
# Isola completamente os tensores e buffers do modelo do Keychain, tokens OAuth em memória e pilha TLS.
[[bin]]
name = "corvo-llm-worker"
path = "src/bin/corvo_llm_worker.rs"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }
futures-util = "0.3"
aho-corasick = "1.1"
memchr = "2.7"
bytes = "1"
mimalloc = { version = "0.1", default-features = false }
unicode-normalization = "0.1"

# Rede otimizada (§4.1): HTTP/2 + rustls + compressão gzip + connection pooling
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "stream"] }
url = "2.5"
open = "5"

# Criptografia OAuth PKCE S256, verificação SHA-256 de modelos e limpeza de segredos em RAM
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }

# Armazenamento seguro nativo do SO (§1.2): macOS Keychain, Windows Credential Manager, Linux Secret Service
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Persistência local offline e sincronização incremental historyId (§1.3 & §4.1)
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Hardware profiling para otimização de threads físicas (§2.2)
num_cpus = "1.16"
llama-cpp-sys-2 = { version = "0.1.161", default-features = false }

# Binding nativo Rust -> C++ llama.cpp (§2.1 & §2.2)
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal", "sampler"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["sampler"] }

[dev-dependencies]
tempfile = "3"

# Otimização de binário e performance de release (§4.3)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release.package.llama-cpp-sys-2]
opt-level = 3
